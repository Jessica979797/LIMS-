# LIMS 基础设施：Redis + MinIO
# 用法：docker compose up -d

services:
  redis:
    image: redis:7-alpine
    container_name: lims-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  minio:
    image: minio/minio:latest
    container_name: lims-minio
    restart: unless-stopped
    ports:
      - '9000:9000'   # S3 API
      - '9001:9001'   # 管理控制台
    environment:
      MINIO_ROOT_USER: lims
      MINIO_ROOT_PASSWORD: lims123456
    volumes:
      - minio-data:/data
    command: server /data --console-address ':9001'

volumes:
  redis-data:
  minio-data:
